<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ Coin Baku Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #facc15;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .app-container { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; width: 100%; position: relative; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--card-bg); border-bottom: 1px solid var(--border-color); }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-color); display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; }
        .username { font-size: 14px; font-weight: 600; }
        
        /* Content Area */
        .content { flex: 1; overflow-y: auto; padding: 20px; display: none; padding-bottom: 80px; }
        .content.active { display: block; }
        
        /* Home Tab */
        .balance-section { text-align: center; margin: 20px 0; }
        .coin-icon { font-size: 48px; margin-bottom: 10px; }
        .balance-num { font-size: 32px; font-weight: bold; color: var(--accent-color); }
        .profit-rate { font-size: 14px; color: var(--text-secondary); margin-top: 5px; }
        
        .clicker-container { display: flex; justify-content: center; align-items: center; margin: 30px 0; }
        .coin-btn { width: 180px; height: 180px; border-radius: 50%; background: linear-gradient(135deg, #facc15, #ca8a04); border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(250, 204, 21, 0.3); transition: transform 0.1s; }
        .coin-btn:active { transform: scale(0.95); }
        
        /* Navigation */
        .nav-bar { display: flex; justify-content: space-around; background: var(--card-bg); border-top: 1px solid var(--border-color); position: absolute; bottom: 0; width: 100%; padding: 10px 0; }
        .nav-item { background: none; border: none; color: var(--text-secondary); display: flex; flex-direction: column; align-items: center; font-size: 11px; cursor: pointer; gap: 4px; }
        .nav-item.active { color: var(--accent-color); }
        .nav-item span.icon { font-size: 20px; }

        /* Leaderboard */
        .leaderboard-tabs { display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .lb-tab { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 15px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .lb-tab.active { background: var(--accent-color); color: #000; font-weight: bold; border-color: var(--accent-color); }
        
        .lb-item { display: flex; align-items: center; justify-content: background; background: var(--card-bg); padding: 12px 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--border-color); }
        .lb-rank { font-weight: bold; width: 30px; color: var(--accent-color); }
        .lb-details { flex: 1; margin-left: 10px; }
        .lb-name { font-size: 14px; font-weight: 600; }
        .lb-sub { font-size: 11px; color: var(--text-secondary); }
        .lb-score { text-align: right; }
        .lb-balance { font-weight: bold; color: var(--accent-color); font-size: 14px; }
        
        .btn-primary { background: var(--accent-color); color: #000; border: none; padding: 12px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="user-info">
                <div class="avatar" id="user-avatar">O</div>
                <div>
                    <div class="username" id="user-name">Orxan Usta</div>
                    <div style="font-size: 11px; color: var(--text-secondary);" id="user-lvl">Level 1/10</div>
                </div>
            </div>
            <div style="font-size: 12px; background: var(--border-color); padding: 4px 8px; border-radius: 6px;" id="user-id-badge">ID: --</div>
        </div>

        <!-- Home Tab -->
        <div id="tab-home" class="content active">
            <div class="balance-section">
                <div class="coin-icon">🪙</div>
                <div class="balance-num" id="balance-display">0</div>
                <div class="profit-rate" id="profit-display">+0/saat</div>
            </div>
            <div class="clicker-container">
                <button class="coin-btn" id="click-btn">
                    <span style="font-size: 36px;">🪙</span>
                    <span style="font-weight: bold; color: #000; margin-top: 5px;">TAP!</span>
                </button>
            </div>
        </div>

        <!-- Leaderboard Tab -->
        <div id="tab-leaderboard" class="content">
            <h2 style="margin-bottom: 15px; font-size: 18px;">🏆 Liderlər Cədvəli</h2>
            <div class="leaderboard-tabs">
                <button class="lb-tab active" onclick="switchLbTab('balance')">🟡 Xal (Balans)</button>
                <button class="lb-tab" onclick="switchLbTab('profit')">📈 Saatlıq Gəlir</button>
                <button class="lb-tab" onclick="switchLbTab('level')">👑 Səviyyə</button>
            </div>
            <div id="leaderboard-list">
                <div style="text-align: center; color: var(--text-secondary); margin-top: 40px;">Yüklənir...</div>
            </div>
        </div>

        <!-- Friends Tab -->
        <div id="tab-friends" class="content">
            <h2 style="margin-bottom: 15px; font-size: 18px;">👥 Dostlarım</h2>
            <div style="background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--border-color);">
                <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 10px;">Dostlarını dəvət et və hər ikiniz bonus qazanın!</p>
                <button class="btn-primary" onclick="inviteFriend()">🔗 Dəvət Linkini Paylaş</button>
            </div>
            <div id="friends-list">
                <div style="text-align: center; color: var(--text-secondary); margin-top: 20px;">Hələ ki dəvət edilən dost yoxdur.</div>
            </div>
        </div>

        <!-- Navigation Bar -->
        <div class="nav-bar">
            <button class="nav-item active" onclick="switchTab('home', this)">
                <span class="icon">🏠</span>
                <span>Oyun</span>
            </button>
            <button class="nav-item" onclick="switchTab('leaderboard', this); loadLeaderboard('balance');">
                <span class="icon">🏆</span>
                <span>Liderlər</span>
            </button>
            <button class="nav-item" onclick="switchTab('friends', this); loadFriends();">
                <span class="icon">👥</span>
                <span>Dostlar</span>
            </button>
        </div>
    </div>

    <script>
        // Supabase Bağlantısı
        const SUPABASE_URL = 'https://okmzrwtbymnvpbtnlabg.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_DaNydYiJcVBmTXuADN7Rzg_8u5yFiE6';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Telegram İstifadəçi Məlumatları
        const tg = window.Telegram.WebApp;
        tg.expand();

        let user = {
            id: tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : '8541108938',
            name: tg.initDataUnsafe?.user?.first_name || 'Orxan Usta',
            balance: 0,
            profit: 10,
            level: 1,
            referrer_id: null
        };

        // Start parametrlərindən referreri yoxla
        const urlParams = new URLSearchParams(window.location.search);
        const startParam = urlParams.get('start');
        if (startParam && startParam.startsWith('ref_')) {
            user.referrer_id = startParam.replace('ref_', '');
        }

        async function initUser() {
            // Bazada istifadəçi olub olmadığını yoxla
            let { data, error } = await supabaseClient.from('players').select('*').eq('id', user.id).single();
            
            if (!data) {
                // Yeni istifadəçi kimi əlavə et
                await supabaseClient.from('players').insert([user]);
            } else {
                user = data;
            }

            updateUI();
        }

        function updateUI() {
            document.getElementById('balance-display').innerText = Math.floor(user.balance).toLocaleString();
            document.getElementById('profit-display').innerText = `+${user.profit}/saat`;
            document.getElementById('user-name').innerText = user.name;
            document.getElementById('user-avatar').innerText = user.name.charAt(0).toUpperCase();
            document.getElementById('user-lvl').innerText = `Level ${user.level}/10`;
            document.getElementById('user-id-badge').innerText = `ID: ${user.id}`;
        }

        // Klik mexanizmi
        document.getElementById('click-btn').addEventListener('click', async () => {
            user.balance += 1;
            updateUI();
            
            // Bazaya yaz
            await supabaseClient.from('players').update({ balance: user.balance }).eq('id', user.id);
        });

        // Tab dəyişmə
        function switchTab(tabId, btn) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            btn.classList.add('active');
        }

        // Liderlər cədvəli
        async function loadLeaderboard(orderBy = 'balance') {
            const listEl = document.getElementById('leaderboard-list');
            listEl.innerHTML = '<div style="text-align: center; color: var(--text-secondary); margin-top: 40px;">Yüklənir...</div>';

            let { data, error } = await supabaseClient
                .from('players')
                .select('*')
                .order(orderBy, { ascending: false })
                .limit(20);

            if (error || !data || data.length === 0) {
                listEl.innerHTML = '<div style="text-align: center; color: var(--text-secondary); margin-top: 40px;">Hələ ki oyunçu yoxdur.</div>';
                return;
            }

            let html = '';
            data.forEach((p, index) => {
                let isMe = p.id === user.id;
                html += `
                    <div class="lb-item" style="${isMe ? 'border-color: var(--accent-color); background: rgba(250, 204, 21, 0.05);' : ''}">
                        <div class="lb-rank">#${index + 1}</div>
                        <div class="lb-details">
                            <div class="lb-name">${p.name} ${isMe ? '(Sən)' : ''}</div>
                            <div class="lb-sub">Level ${p.level}/10 · ID: ${p.id}</div>
                        </div>
                        <div class="lb-score">
                            <div class="lb-balance">🪙 ${Math.floor(p.balance).toLocaleString()}</div>
                            <div class="lb-sub">+${p.profit}/saat</div>
                        </div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        function switchLbTab(type) {
            document.querySelectorAll('.lb-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            loadLeaderboard(type);
        }

        // Dostlar siyahısı
        async function loadFriends() {
            const friendsEl = document.getElementById('friends-list');
            let { data, error } = await supabaseClient
                .from('players')
                .select('*')
                .eq('referrer_id', user.id);

            if (!data || data.length === 0) {
                friendsEl.innerHTML = '<div style="text-align: center; color: var(--text-secondary); margin-top: 20px;">Hələ ki dəvət edilən dost yoxdur.</div>';
                return;
            }

            let html = '';
            data.forEach(f => {
                html += `
                    <div class="lb-item">
                        <div class="lb-details">
                            <div class="lb-name">${f.name}</div>
                            <div class="lb-sub">Level ${f.level}</div>
                        </div>
                        <div class="lb-balance">🪙 ${Math.floor(f.balance).toLocaleString()}</div>
                    </div>
                `;
            });
            friendsEl.innerHTML = html;
        }

        function inviteFriend() {
            const botUsername = "AzCoinBakuBot"; 
            const inviteUrl = `https://t.me/${botUsername}?start=ref_${user.id}`;
            if (navigator.share) {
                navigator.share({ title: 'AZ Coin Baku', text: 'Mənimlə birlikdə AZ Coin qazan!', url: inviteUrl });
            } else {
                prompt("Dəvət linkini kopyala:", inviteUrl);
            }
        }

        // Oyunu başladanda məlumatları yüklə
        initUser();
    </script>
</body>
</html>
