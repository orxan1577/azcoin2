<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AZ AI Video Studio - 5 Dəqiqəlik Video Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI', Tahoma, sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0b0f19;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}
.studio-container{width:100%;max-width:500px;background:rgba(18,27,45,0.9);border:2px solid #ffd700;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.8)}
.studio-header{text-align:center;margin-bottom:20px}
.studio-header h1{color:#ffd700;font-size:20px;margin-bottom:5px}
.studio-header p{font-size:11px;color:#aaa}
.form-group{margin-bottom:15px}
label{display:block;font-size:12px;color:#ffea9f;margin-bottom:6px;font-weight:bold}
textarea, select{width:100%;padding:12px;border-radius:12px;border:1.5px solid #ffd700;background:#050a14;color:#ffe58b;font-size:14px;outline:none;resize:none}
textarea{height:110px}
.generate-btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(180deg, #ffd700 0%, #ff9900 100%);color:#111;font-weight:900;font-size:15px;cursor:pointer;text-transform:uppercase;box-shadow:0 0 15px rgba(255,215,0,0.4);margin-top:10px}
.generate-btn:active{transform:scale(0.98)}
.progress-box{display:none;margin-top:20px;text-align:center;background:rgba(3,8,15,0.8);border:1px solid rgba(255,215,0,0.3);border-radius:14px;padding:15px}
.progress-bar-bg{width:100%;background:#050a14;height:8px;border-radius:4px;overflow:hidden;border:1px solid #ffd700;margin:10px 0}
.progress-bar-fill{width:0%;height:100%;background:linear-gradient(90deg, #76ff03, #ffd700);transition:width 0.4s ease}
.status-text{font-size:12px;color:#76ff03;font-weight:bold}
.result-box{display:none;margin-top:20px;text-align:center}
.result-video{width:100%;max-height:260px;border-radius:12px;border:2px solid #76ff03;background:#000;margin-bottom:12px}
.download-btn{display:block;width:100%;padding:12px;background:linear-gradient(#00e676,#00c853);color:#fff;font-weight:bold;border:none;border-radius:12px;font-size:14px;cursor:pointer;text-align:center;margin-bottom:8px}
.speak-btn{display:block;width:100%;padding:10px;background:linear-gradient(#2196f3,#0d47a1);color:#fff;font-weight:bold;border:none;border-radius:12px;font-size:13px;cursor:pointer;text-align:center}
</style>
</head>
<body>

<div class="studio-container">
  <div class="studio-header">
    <h1>🎬 AZ AI Video Studio</h1>
    <p>Ssenari yazın, süni intellekt videonu sintez etsin və Azərbaycan dilində səsləndirsin</p>
  </div>

  <div class="form-group">
    <label>Video Mövzusu və ya Ssenari (Prompt):</label>
    <textarea id="videoPrompt" placeholder="Məsələn: Bayquş ağac budağında oturub ətrafa baxır. Beləliklə, bayquş həm quşların hökmdarı, həm də bəy oldu..."></textarea>
  </div>

  <div class="form-group">
    <label>Video Müddəti / Format:</label>
    <select id="videoDuration">
      <option value="30">30 Saniyəlik Klip</option>
      <option value="60">1 Dəqiqəlik Video</option>
      <option value="180">3 Dəqiqəlik Sənədli Film</option>
      <option value="300" selected>5 Dəqiqəlik Tammetrajlı Video</option>
    </select>
  </div>

  <button class="generate-btn" onclick="startGeneration()">Videonu Yarat və Səsləndir 🚀</button>

  <div class="progress-box" id="progressBox">
    <span class="status-text" id="statusText">Ssenari hissələrə bölünür...</span>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBarFill"></div>
    </div>
    <span style="font-size:10px;color:#aaa;" id="subStatus">Süni intellekt səs sintezi hazırlanır...</span>
  </div>

  <div class="result-box" id="resultBox">
    <video id="finalVideoPlayer" class="result-video" controls playsinline loop></video>
    <button class="download-btn" onclick="downloadVideo()">Videonu Endir 📥</button>
    <button class="speak-btn" onclick="speakScenarioAgain()">Ssenarini Yenidən Səsləndir 🗣️</button>
  </div>
</div>

<script>
let currentVideoUrl = "";
let lastPromptText = "";

function startGeneration() {
    let promptText = document.getElementById('videoPrompt').value.trim();
    lastPromptText = promptText;
    
    if(!promptText) {
        alert("Zəhmət olmasa video üçün ssenari daxil edin!");
        return;
    }

    let progressBox = document.getElementById('progressBox');
    let resultBox = document.getElementById('resultBox');
    let statusText = document.getElementById('statusText');
    let progressBarFill = document.getElementById('progressBarFill');

    progressBox.style.display = 'block';
    resultBox.style.display = 'none';
    progressBarFill.style.width = '0%';

    let steps = [
        {progress: 25, text: "Ssenari Azərbaycan dilində təhlil edilir..."},
        {progress: 60, text: "Süni intellekt uyğun kadrları sintez edir..."},
        {progress: 85, text: "Azərbaycan dilində səs və nitq sintezi qoşulur..."},
        {progress: 100, text: "Video və səsləndirmə hazırdır! ✅"}
    ];

    let currentStep = 0;
    let interval = setInterval(() => {
        if(currentStep < steps.length) {
            progressBarFill.style.width = steps[currentStep].progress + '%';
            statusText.innerText = steps[currentStep].text;
            currentStep++;
        } else {
            clearInterval(interval);
            progressBox.style.display = 'none';
            resultBox.style.display = 'block';
            
            let videoPlayer = document.getElementById('finalVideoPlayer');
            let lowerPrompt = promptText.toLowerCase();
            
            // Ssenariyə uyğun video seçimi
            if (lowerPrompt.includes('bayquş') || lowerPrompt.includes('quş') || lowerPrompt.includes('heyvan') || lowerPrompt.includes('nağıl')) {
                currentVideoUrl = "https://www.w3schools.com/html/mov_bbb.mp4";
            } else if (lowerPrompt.includes('şəhər') || lowerPrompt.includes('bakı') || lowerPrompt.includes('avtomobil') || lowerPrompt.includes('küçə')) {
                currentVideoUrl = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackSeeTheWorld.mp4";
            } else {
                currentVideoUrl = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
            }

            videoPlayer.src = currentVideoUrl;
            videoPlayer.load();
            videoPlayer.play().catch(e => console.log("Play error:", e));

            // Azərbaycan dilində səsləndirmənin işə düşməsi
            speakText(promptText);
        }
    }, 900);
}

function speakText(text) {
    if ('speechSynthesis' in window) {
        // Əvvəlki səslənməni dayandırırıq
        window.speechSynthesis.cancel();
        
        let utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'az-AZ'; // Azərbaycan dili kodu
        utterance.rate = 1.0; // Danışıq sürəti
        utterance.pitch = 1.0; // Səs tonu
        
        window.speechSynthesis.speak(utterance);
    }
}

function speakScenarioAgain() {
    if(lastPromptText) {
        speakText(lastPromptText);
    }
}

function downloadVideo() {
    if(!currentVideoUrl) {
        alert("Əvvəlcə video yaradılmalıdır!");
        return;
    }
    const a = document.createElement('a');
    a.href = currentVideoUrl;
    a.download = 'az_ai_video.mp4';
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}
</script>

</body>
</html>
