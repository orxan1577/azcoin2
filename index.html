<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AZ COIN - Baku Edition</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0;font-family:'Segoe UI', Tahoma, Verdana, sans-serif;display:flex;justify-content:center;color:#fff;overflow-x:hidden;background:url('https://images.unsplash.com/photo-1524813686514-a57563d77840?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;background-size:cover;height:100vh}
.game-container{width:100%;max-width:480px;height:100vh;max-height:860px;position:relative;background:rgba(5, 12, 22, 0.75);overflow:hidden;box-shadow:0 0 25px rgba(0,0,0,0.8);touch-action:manipulation}
.user-profile-header{position:absolute;top:10px;left:6px;display:flex;align-items:center;gap:6px;z-index:25;background:rgba(10,25,40,0.85);border:1.5px solid #ffd700;border-radius:20px;padding:3px 8px 3px 3px;box-shadow:0 0 8px rgba(255,215,0,0.4);transform:scale(0.85);transform-origin:top left}
.user-avatar{width:28px;height:28px;border-radius:50%;border:1.5px solid #ffd700;object-fit:cover;background:#111;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#ffd700;font-size:12px}
.user-info-text{display:flex;flex-direction:column;text-align:left}
.user-name-row{display:flex;align-items:center;gap:3px}
.user-name{font-size:10px;font-weight:bold;color:#ffe58b;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.verified-badge{display:inline-flex;width:11px;height:11px;background:#0095ff;color:#fff;border-radius:50%;font-size:7px;font-weight:bold;justify-content:center;align-items:center;box-shadow:0 0 4px #0095ff}
.user-id{font-size:8px;color:#aaa}
.settings-btn{position:absolute;top:10px;right:6px;width:32px;height:32px;background:rgba(10,25,40,0.85);border:1.5px solid #ffd700;border-radius:50%;display:flex;justify-content:center;align-items:center;cursor:pointer;z-index:25;box-shadow:0 0 8px rgba(255,215,0,0.4);font-size:15px}

.rank-container{position:absolute;top:52px;left:10px;right:10px;z-index:20;background:rgba(10,25,40,0.85);padding:5px 10px;border-radius:10px;border:1px solid rgba(255,215,0,0.3)}
.rank-info-row{display:flex;justify-content:space-between;font-size:11px;font-weight:bold;color:#ffea9f;margin-bottom:3px}
.rank-bar-bg{width:100%;background:rgba(0,0,0,0.5);height:6px;border-radius:3px;overflow:hidden;border:1px solid rgba(255,215,0,0.3)}
.rank-bar-fill{width:0%;height:100%;background:linear-gradient(90deg, #76ff03, #ffd700);border-radius:3px;transition: width 0.3s ease}

.top-stats-container{position:absolute;top:92px;left:10px;right:10px;background:rgba(10,25,40,0.85);border:1.5px solid #ffd700;border-radius:14px;padding:6px 8px;text-align:center;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;box-shadow:0 4px 15px rgba(0,0,0,0.6);z-index:20}
.stat-box{font-size:9px;color:#aaa}
.stat-box b{display:block;font-size:11px;color:#ffd700;margin-top:2px}

.dynamic-balance{position:absolute;top:150px;left:50%;transform:translateX(-50%);font-size:28px;font-weight:900;color:#ffe58b;text-shadow:0 0 12px #ff9900;z-index:20;display:flex;align-items:center;gap:6px}
.coin-icon-small{width:26px;height:26px;background:#ffd700;border-radius:50%;display:inline-flex;justify-content:center;align-items:center;font-size:14px;box-shadow:0 0 8px #ff9900}
.coin-click-area{position:absolute;top:35%;left:22%;width:56%;height:26%;cursor:pointer;z-index:30;border-radius:15px;background:radial-gradient(circle, rgba(255,215,0,0.2) 0%, rgba(0,0,0,0) 70%)}
.coin-click-area:active{transform:scale(0.97)}

.bottom-left-boost{position:absolute;top:63%;left:12px;background:rgba(10,25,40,0.9);border:1.5px solid #ffd700;border-radius:12px;padding:8px 12px;text-align:center;z-index:25;cursor:pointer;box-shadow:0 0 10px rgba(255,215,0,0.4)}
.brb-txt{font-size:11px;color:#ffd700;font-weight:bold}
.brb-sub{font-size:9px;color:#ffea9f;margin-top:2px}

.bottom-right-energy{position:absolute;top:63%;right:12px;background:rgba(10,25,40,0.9);border:1.5px solid #ffd700;border-radius:12px;padding:8px 12px;text-align:right;z-index:25;cursor:pointer;box-shadow:0 0 10px rgba(255,215,0,0.4)}
.ble-txt{font-size:10px;color:#76ff03;font-weight:bold}
.sup-txt{font-size:9px;color:#ffea9f;margin-top:2px}

.bottom-right-leaders{position:absolute;top:73%;right:12px;background:rgba(10,25,40,0.9);border:1.5px solid #ffd700;border-radius:12px;padding:7px 12px;text-align:center;z-index:25;cursor:pointer;box-shadow:0 0 10px rgba(255,215,0,0.4)}
.brl-txt{font-size:11px;color:#ffd700;font-weight:bold}
.brl-sub{font-size:8px;color:#ffea9f;margin-top:1px}

.bottom-actions{position:absolute;bottom:12px;left:10px;right:10px;display:flex;justify-content:space-around;padding:0 5px;z-index:25}
.action-badge{background:rgba(10,25,40,0.88);border:2px solid #ffd700;border-radius:12px;padding:8px 12px;font-size:11px;font-weight:bold;color:#ffea9f;cursor:pointer;box-shadow:0 0 10px rgba(255,215,0,0.4)}

.modal-overlay{position:absolute;inset:0;background:rgba(5, 12, 22, 0.92);display:none;flex-direction:column;z-index:200;padding:16px;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid rgba(255,215,0,0.4);padding-bottom:10px;margin-bottom:20px}
.gold-back-btn{background:linear-gradient(180deg, #ffe58b 0%, #ffd700 50%, #cca100 100%);border:1.5px solid #fff;color:#111;font-weight:900;padding:8px 16px;border-radius:12px;cursor:pointer;font-size:12px}
.modal-title{color:#ffd700;font-size:18px;font-weight:900;margin:0;text-align:center;flex-grow:1}
.modal-body{flex-grow:1;overflow-y:auto;padding-bottom:20px}
.settings-card-3d{background:linear-gradient(135deg, rgba(20,40,65,0.85) 0%, rgba(10,20,35,0.95) 100%);border:2px solid rgba(255,215,0,0.5);border-radius:20px;padding:16px;box-shadow:0 10px 25px rgba(0,0,0,0.7);margin-bottom:15px}
.settings-label{font-size:13px;color:#ffea9f;display:block;margin-bottom:8px;font-weight:bold}
.wallet-warning{font-size:10px;color:#ff9900;line-height:1.4;margin-top:8px;background:rgba(255,153,0,0.1);border:1px dashed rgba(255,153,0,0.4);padding:8px;border-radius:10px;text-align:left}
.flags-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;margin-bottom:18px}
.flag-btn{background:linear-gradient(145deg, #0d2238, #071625);border:2px solid rgba(255,215,0,0.3);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer}
.flag-btn.active{background:linear-gradient(145deg, #254212, #132608);border-color:#76ff03;box-shadow:0 0 15px rgba(118,255,3,0.5)}
.flag-icon{font-size:24px;display:block;margin-bottom:4px}
.flag-name{font-size:11px;color:#fff;font-weight:bold}
.settings-input{width:100%;padding:14px 16px;border-radius:14px;border:2px solid #ffd700;background:#03080f;color:#ffe58b;font-size:16px;font-weight:bold;outline:none;margin-bottom:12px}
.gold-3d-btn{width:100%;height:50px;background:linear-gradient(180deg, #1f1b0a 0%, #120e03 50%, #080601 100%);border:2px solid #ffd700;border-radius:14px;color:#ffd700;font-weight:900;font-size:15px;cursor:pointer;text-transform:uppercase;margin-top:5px}

.cards-grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:10px}
.biz-card{background:rgba(12,25,38,0.9);border:1.5px solid #ffd700;border-radius:14px;padding:10px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 0 10px rgba(255,215,0,0.2)}
.biz-card.locked{border-color:#555;background:rgba(20,20,25,0.75);opacity:0.75;box-shadow:none}
.biz-lvl{font-size:10px;color:#ffea9f;margin-bottom:4px;font-weight:bold}
.biz-income{font-size:13px;font-weight:bold;color:#76ff03;margin-bottom:4px}
.biz-price{font-size:10px;color:#ccc;margin-bottom:10px}
.biz-btn{width:100%;padding:8px;border-radius:8px;border:none;font-weight:bold;font-size:11px;cursor:pointer}
.biz-btn.active{background:rgba(255,215,0,0.2);color:#ffd700;border:1px solid #ffd700}
.biz-btn.buy{background:linear-gradient(#ffd700,#ffa000);color:#111}
.biz-btn.locked{background:#333;color:#ff5555;cursor:not-allowed;border:1px solid #555}

.inv-item{background:rgba(255,215,0,0.06);border:1px solid rgba(255,215,0,0.25);border-radius:12px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.inv-info{display:flex;align-items:center;gap:10px}
.social-icon{font-size:22px}
.inv-info b{display:block;font-size:13px;color:#fff}
.inv-info span{font-size:11px;color:#ffd700}
.inv-btn{background:linear-gradient(#00e676,#00c853);border:none;color:#fff;font-weight:bold;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:11px}
.inv-btn.done{background:linear-gradient(#1b5e20, #0f3812);color:#76ff03;border:1px solid #76ff03;cursor:pointer;}
.friend-row{background:rgba(255,215,0,0.05);border:1px solid rgba(255,215,0,0.2);border-radius:10px;padding:8px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.friend-row span{color:#ffea9f}

.leader-card{background:rgba(12,28,45,0.9);border:1.5px solid rgba(255,215,0,0.35);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.leader-card.me{border-color:#76ff03;background:rgba(25,55,20,0.85);box-shadow:0 0 12px rgba(118,255,3,0.3)}
.leader-left{display:flex;align-items:center;gap:10px}
.leader-rank{width:28px;height:28px;border-radius:50%;background:rgba(255,215,0,0.2);border:1px solid #ffd700;display:flex;justify-content:center;align-items:center;font-weight:900;font-size:12px;color:#ffd700}
.leader-rank.top1{background:linear-gradient(#ffd700,#ff9900);color:#111}
.leader-rank.top2{background:linear-gradient(#e0e0e0,#9e9e9e);color:#111}
.leader-rank.top3{background:linear-gradient(#cd7f32,#8d5524);color:#fff}
.leader-details b{font-size:13px;color:#fff;display:block}
.leader-details span{font-size:10px;color:#ffea9f}
.leader-right{text-align:right}
.leader-score{font-size:12px;font-weight:bold;color:#ffd700;display:block}
.leader-profit{font-size:10px;color:#76ff03}

.pop-text{position:absolute;left:50%;top:40%;transform:translate(-50%, -50%) scale(0.5);font-weight:900;font-size:45px;background:linear-gradient(180deg, #ffffff 0%, #ffdf73 30%, #ffd700 60%, #cc9900 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;pointer-events:none;z-index:999999;animation:float3DCenter 0.7s forwards}
@keyframes float3DCenter{
  0%{opacity:0;transform:translate(-50%, -50%) scale(0.4) rotate(-5deg);filter:blur(5px);}
  30%{opacity:1;transform:translate(-50%, -120px) scale(1.3) rotate(3deg);filter:blur(0px);}
  100%{opacity:0;transform:translate(-50%, -200px) scale(1) rotate(0deg);filter:blur(0px);}
}
</style>
</head>
<body>
<div class="game-container" id="gameArea">
  <div class="user-profile-header">
    <div class="user-avatar" id="userAvatar">O</div>
    <div class="user-info-text">
      <div class="user-name-row"><span class="user-name" id="userName">Orxan</span><span class="verified-badge">✓</span></div>
      <span class="user-id" id="userIdLabel">ID: 7171314206</span>
    </div>
  </div>
  <div class="settings-btn" onclick="openModal('settingsModal')">⚙️</div>

  <div class="rank-container">
    <div class="rank-info-row"><span id="rank
